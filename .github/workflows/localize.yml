name: 汉化同步与发布

# 上游 janblade/OptiScaler-F5-DLSSNR-Multipass 更新很勤，人工重做汉化必然跟不上。
# 这条流水线把「跟上游」变成自动的：
#   取上游源码 -> 重放汉化层 -> 扫出新串 -> 自动翻译 -> 云端编译 -> 发 Release
#
# 本仓库只跟踪汉化资产（dict/ overlay/ scripts/ tools/ .github/ README-ZH.md），
# 上游源码每次现取现用，不提交。所以汉化和上游之间不存在 merge 冲突。
#
# 人工只在两种情况需要介入：
#   1. apply_patch 报「结构锚点未命中」——上游改了我们动过的那段代码
#   2. dict/untranslated.json 里积累了待裁决的串

on:
  schedule:
    - cron: '0 21 * * *'          # 每天 21:00 UTC = 次日 05:00 北京
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型：auto=上游有新正式版就发正式版，否则 nightly'
        type: choice
        options: [auto, nightly, release]
        default: auto
      skip_build:
        description: '只同步与翻译，不编译'
        type: boolean
        default: false
  push:
    paths:
      - 'dict/**'
      - 'scripts/**'
      - 'overlay/**'
      - '.github/workflows/localize.yml'

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/janblade/OptiScaler-F5-DLSSNR-Multipass.git
  UPSTREAM_BRANCH: main
  # 所有脚本的诊断输出都是中文。Windows runner 的默认输出编码是 cp1252，
  # 不加这个的话 python 一 print 中文就 UnicodeEncodeError 退出 ——
  # 编译任务（windows）红、同步任务（ubuntu）正常，根因就在这里。
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  # ------------------------------------------------------------------
  # 1. 取上游源码 + 预检锚点 + 自动补译
  # ------------------------------------------------------------------
  sync:
    name: 同步上游与翻译
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      rtype: ${{ steps.ver.outputs.rtype }}
      sha: ${{ steps.sync_up.outputs.sha }}
      build_required: ${{ steps.check.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取上游源码
        id: sync_up
        run: |
          set +e
          bash scripts/sync_upstream.sh "$UPSTREAM_REPO" "$UPSTREAM_BRANCH"
          CODE=$?
          set -e
          # 0=有变化，1=无变化，>=2 才是真出错
          if [ "$CODE" -ge 2 ]; then
            echo "::error::同步上游失败（退出码 $CODE）"
            exit 1
          fi
          SHA=$(grep -m1 '^commit=' .upstream-revision | cut -d= -f2)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ $CODE -eq 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # 让后面的步骤能读到上游版本号。
          # 这个 fork 有两套版本号：VER_MAJOR/MINOR/HOTFIX 是冻结的「上游同步
          # 标记」（长期停在 0.7.7，还被 XeSS/FSR 包装层拿去对游戏伪装引擎版本），
          # fork 自己的发布号在 NR_RELEASE_*（v0.1.24 这种，对应上游仓库的
          # git tag vX.Y.Z-slug）。要的是后者。
          # 老版本可能还没有 NR_RELEASE_*，回退到 VER_*。
          if [ -f OptiScaler/resource.h ]; then
            RH=OptiScaler/resource.h
            MAJ=$(grep -oP 'NR_RELEASE_MAJOR_VERSION\s+\K\d+'  "$RH" | head -1)
            MIN=$(grep -oP 'NR_RELEASE_MINOR_VERSION\s+\K\d+'  "$RH" | head -1)
            HOT=$(grep -oP 'NR_RELEASE_HOTFIX_VERSION\s+\K\d+' "$RH" | head -1)
            if [ -z "$MAJ" ] || [ -z "$MIN" ] || [ -z "$HOT" ]; then
              MAJ=$(grep -oP 'VER_MAJOR_VERSION\s+\K\d+'  "$RH" | head -1)
              MIN=$(grep -oP 'VER_MINOR_VERSION\s+\K\d+'  "$RH" | head -1)
              HOT=$(grep -oP 'VER_HOTFIX_VERSION\s+\K\d+' "$RH" | head -1)
            fi
            echo "ver=v${MAJ}.${MIN}.${HOT}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=" >> "$GITHUB_OUTPUT"
          fi

      - name: 预检汉化锚点
        run: |
          # 只检测不落盘。上游动过我们改的那段代码时这里立刻红，
          # 不用等整个编译跑完才发现。
          set +e
          python scripts/apply_patch.py . --check | tee precheck.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -eq 2 ]; then
            echo "::error::汉化结构锚点未命中，需要人工修 dict/structural.json（日志见下）"
            exit 1
          fi

      - name: 扫描未翻译字符串
        id: scan
        run: |
          set +e
          python scripts/scan_strings.py . --out pending.json --markdown pending.md
          set -e
          CNT=$(python -c "import json;print(len(json.load(open('pending.json'))))" 2>/dev/null || echo 0)
          echo "待翻译 $CNT 条"
          if [ "${CNT:-0}" -gt 0 ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 自动翻译新串
        if: steps.scan.outputs.has_new == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/translate.py --input pending.json

      - name: 提交汉化资产变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A 必需：sync_upstream.sh 会删掉误入资产目录的上游文件，
          # 光用 `git add <path>` 不一定把删除记全。
          git add -A -- dict overlay scripts tools .github README-ZH.md .upstream-revision
          if git diff --cached --quiet; then
            echo "资产无变更"
          else
            git commit -m "chore: 同步上游 ${{ steps.sync_up.outputs.sha }} 并更新汉化"
            git push
          fi

      - name: 确定版本号与发布类型
        id: ver
        run: |
          set -e
          VER="${{ steps.sync_up.outputs.ver }}"
          DATE=$(date -u +%Y%m%d)
          TYPE="${{ github.event.inputs.release_type || 'auto' }}"
          if [ "$TYPE" = "nightly" ]; then
            TAG="nightly-$DATE"
          elif [ "$TYPE" = "release" ] && [ -n "$VER" ]; then
            TAG="$VER"
          else
            # auto：上游 fork 发过 $VER 对应的正式版 tag、且本仓库还没发过
            # -> 发正式版，否则 nightly。
            # 必须查「上游 fork」的 releases，不是 optiscaler/OptiScaler ——
            # 后者只是这个 fork 的底座，两者版本号不是一个序列（底座冻结在
            # 0.7.7），拿它比对会让 auto 永远退化成 nightly。
            UP_SLUG=$(printf '%s' "$UPSTREAM_REPO" | sed -E 's#^https://github.com/##; s#\.git$##')
            UP_TAG=""
            if [ -n "$VER" ]; then
              UP_TAG=$(gh api "repos/$UP_SLUG/releases?per_page=50" \
                         --jq '.[] | select(.draft == false) | .tag_name' 2>/dev/null \
                       | grep -E "^${VER}([-.]|$)" | head -1 || true)
            fi
            if [ -n "$UP_TAG" ] && \
               ! gh release view "$UP_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              TAG="$UP_TAG"; TYPE="release"
            else
              TAG="nightly-$DATE"; TYPE="nightly"
            fi
          fi
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "rtype=$TYPE" >> "$GITHUB_OUTPUT"
          echo "本次发布: $TAG ($TYPE)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 判断是否需要编译
        id: check
        run: |
          REQ=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQ=true
          elif [ "${{ steps.sync_up.outputs.changed }}" = "true" ] || [ "${{ steps.scan.outputs.has_new }}" = "true" ]; then
            REQ=true
          fi
          if [ "${{ github.event.inputs.skip_build }}" = "true" ]; then REQ=false; fi
          echo "required=$REQ" >> "$GITHUB_OUTPUT"
          echo "是否需要编译: $REQ"

      - uses: actions/upload-artifact@v4
        if: steps.scan.outputs.has_new == 'true'
        with:
          name: pending-strings
          path: |
            pending.json
            pending.md
          retention-days: 30

  # ------------------------------------------------------------------
  # 2. 云端编译
  # ------------------------------------------------------------------
  build:
    name: Windows 编译
    needs: sync
    if: needs.sync.outputs.build_required == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 取上游源码与子模块（按预检时的 SHA）
        shell: bash
        env:
          # 编译必须要有 external/ 下的 10 个 git 子模块（simpleini、spdlog、
          # vulkan、FidelityFX-SDK、nvapi……）。checkout 只写 gitlink，不拉内容。
          SYNC_SUBMODULES: '1'
        run: |
          # 按 SHA 取，保证「编译的代码」和「预检通过的代码」是同一份
          set +e
          bash scripts/sync_upstream.sh "$UPSTREAM_REPO" "$UPSTREAM_BRANCH" "${{ needs.sync.outputs.sha }}"
          CODE=$?
          set -e
          # 0=有变化，1=无变化，>=2 才是真出错。以前这里写 `|| true`，
          # 把错误和「无变化」一起吞了：子模块没拉下来也照样往下走，
          # 最后红在 MSBuild 上，日志里看不出根因。
          if [ "$CODE" -ge 2 ]; then
            echo "::error::同步上游失败（退出码 $CODE）"
            exit 1
          fi

      - name: 重放汉化层
        shell: bash
        run: python scripts/apply_patch.py . --report apply-report.json

      - name: 加入 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 编译
        shell: pwsh
        run: pwsh scripts/build.ps1 -SourceDir "$env:GITHUB_WORKSPACE" -OutDir "$env:GITHUB_WORKSPACE/dist/ZH"

      - name: 打包 7z
        shell: pwsh
        run: |
          Push-Location "$env:GITHUB_WORKSPACE/dist/ZH"
          7z a -t7z -mx=9 "$env:GITHUB_WORKSPACE/dist/OptiScaler-ZH-${{ needs.sync.outputs.tag }}.7z" "*"
          Pop-Location

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: release-7z
          path: |
            dist/*.7z
            apply-report.json
          retention-days: 7

  # ------------------------------------------------------------------
  # 3. 发布
  # ------------------------------------------------------------------
  release:
    name: 发布
    needs: [sync, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-7z
          path: artifact

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.sync.outputs.tag }}
          RTYPE: ${{ needs.sync.outputs.rtype }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -e

          # 包内 7z 的层级由 upload-artifact 的「公共父目录」决定。编译任务里
          # 同时传了 dist/*.7z 和 apply-report.json，公共父目录退化成工作区根，
          # 于是包内是 dist/xxx.7z；下载到 dist/ 后就成了 dist/dist/xxx.7z。
          # 以前写死 `ls dist/*.7z` 会直接落空，被 set -e 干掉，页面只留
          # 「exit code 1」，看不出原因。改成递归找，不依赖层级。
          echo "== 产物实际内容 =="
          find artifact -type f -printf '%10s  %p\n' | sort -k2
          ZIP=$(find artifact -type f -name '*.7z' | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::产物里没有 .7z 文件，无法发布"
            exit 1
          fi
          echo "使用产物: $ZIP ($(du -h "$ZIP" | cut -f1))"

          if [ -z "$TAG" ]; then
            echo "::error::tag 为空，无法发布"
            exit 1
          fi

          if [ "$RTYPE" = "release" ]; then
            TITLE="$TAG 简体中文版"
            NOTES="对应上游 $TAG 的简体中文版"
            PRE=false
          else
            # TAG 本身已经是 nightly-YYYYMMDD，再加 "Nightly " 前缀会渲染成
            # "Nightly nightly-20260930"。GitHub 对 prerelease 本来就会挂
            # Pre-release 徽章，标题直接给 tag 就行。
            TITLE="$TAG"
            NOTES="每日自动构建：上游最新源码 + 简体中文汉化"
            PRE=true
          fi
          NOTES="$NOTES

          上游 commit: \`$SHA\`
          构建自 $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # nightly 同日重复触发时加序号；正式版绝不覆盖
          if [ "$RTYPE" = "release" ] && gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::$TAG 已存在，拒绝覆盖"
            exit 1
          fi
          FOUND=""
          for S in "" "-2" "-3" "-4" "-5"; do
            C="$TAG$S"
            if ! gh release view "$C" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              TAG="$C"
              if [ -n "$S" ]; then
                TITLE="$TITLE ($(echo "$S" | tr -d '-'))"
              fi
              FOUND=1
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "tag 已占满，跳过发布"
            exit 0
          fi

          # 7z 的文件名是编译任务按 sync 阶段的 tag 起的（OptiScaler-ZH-nightly-20260930.7z），
          # 而这里可能因为去重把 tag 变成了 nightly-20260930-2。不改名的话，
          # 资产名和它所在的 release tag 对不上，用户看不出来是同一个东西。
          NEWZIP="$(dirname "$ZIP")/OptiScaler-ZH-$TAG.7z"
          if [ "$ZIP" != "$NEWZIP" ]; then
            mv "$ZIP" "$NEWZIP"
            echo "资产改名: $(basename "$ZIP") -> $(basename "$NEWZIP")"
            ZIP="$NEWZIP"
          fi

          # gh 自己失败不会产生注解，页面只剩 exit code 1。把 stderr 逐行
          # 打成 ::error::，这样出错原因在 Annotations 里直接可读。
          if ! gh release create "$TAG" "$ZIP" --repo "${{ github.repository }}" \
                 --title "$TITLE" --notes "$NOTES" --prerelease="$PRE" 2> gh.err; then
            echo "::error::gh release create 失败："
            while IFS= read -r l; do
              if [ -n "$l" ]; then echo "::error::$l"; fi
            done < gh.err
            exit 1
          fi
          echo "已发布 $TAG"
